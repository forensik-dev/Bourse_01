<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bourse</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border-radius: 12px;
            padding: 14px 22px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            line-height: 1.1;
        }

        .logo .easy {
            color: #2563eb;
            font-weight: 800;
            font-size: 1.6em;
            letter-spacing: -0.5px;
        }

        .logo .bourse {
            color: #6b7280;
            font-weight: 800;
            font-size: 1.6em;
            letter-spacing: -0.5px;
        }

        .logo .sous-titre {
            font-size: 0.72em;
            color: #9ca3af;
        }

        .btn-import {
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-import:hover {
            background: #1d4ed8;
        }

        .landing {
            background: #fff;
            border-radius: 12px;
            padding: 60px 30px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .landing p {
            color: #666;
            margin-bottom: 24px;
        }

        .haut {
            display: flex;
            gap: 16px;
            align-items: stretch;
            margin-bottom: 24px;
        }

        .bloc {
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .bloc-infos {
            flex: 1;
            background: #fff;
            font-size: 0.92em;
        }

        .bloc-infos table {
            width: 100%;
            border-collapse: collapse;
        }

        .bloc-infos td {
            padding: 4px 8px;
        }

        .bloc-infos td:first-child {
            color: #666;
            width: 55%;
        }

        .bloc-infos tr.entete td {
            color: #999;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #eee;
            padding-bottom: 6px;
        }

        .champ-cumul {
            border: 1px solid #d4d8e0;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.95em;
            width: 140px;
        }

        .champ-cumul:focus {
            outline: 2px solid #2563eb;
            outline-offset: -1px;
        }

        .bloc-centrale {
            flex: 1;
            background: #eceff3;
        }

        .bloc-centrale .label {
            font-size: 0.75em;
            color: #2563eb;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .bloc-centrale .valeur-totale {
            font-size: 1.9em;
            font-weight: 800;
            color: #1a1a2e;
            margin: 2px 0 12px;
            font-variant-numeric: tabular-nums;
        }

        .bloc-centrale .ligne {
            font-size: 0.9em;
            font-weight: 600;
            margin-top: 3px;
            font-variant-numeric: tabular-nums;
        }

        .bloc-indices {
            flex: 1.4;
            background: #fff;
            overflow-x: auto;
        }

        table.indices {
            border-collapse: collapse;
            width: 100%;
            font-size: 0.8em;
        }

        table.indices th {
            color: #999;
            font-size: 0.72em;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 4px 8px;
            text-align: left;
            border-bottom: 1px solid #eee;
            white-space: nowrap;
        }

        table.indices td {
            padding: 5px 8px;
            vertical-align: top;
        }

        table.indices .nom {
            font-weight: 600;
            display: block;
        }

        table.indices .val {
            font-variant-numeric: tabular-nums;
        }

        h2 {
            font-size: 1.1em;
            margin-bottom: 12px;
        }

        .table-wrapper {
            overflow-x: auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table.positions {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        table.positions th,
        table.positions td {
            padding: 10px 14px;
            text-align: left;
            font-size: 0.88em;
        }

        table.positions th {
            background: #0d1b3e;
            color: #fff;
            text-transform: uppercase;
            font-size: 0.75em;
            letter-spacing: 0.5px;
        }

        table.positions tr:nth-child(even) {
            background: #f8f9fb;
        }

        table.positions tr:hover {
            background: #eef1f6;
        }

        .num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .positif { color: #16a34a; font-weight: 600; }
        .negatif { color: #dc2626; font-weight: 600; }

        .symbole {
            font-weight: bold;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="easy">easy</span><span class="bourse">bourse</span>
                <div class="sous-titre">Groupe La Banque Postale</div>
            </div>
            <button class="btn-import" id="btn-import">Import CSV intraday</button>
            <input type="file" id="file-input" accept=".csv,text/csv" class="hidden">
        </header>

        <div id="landing" class="landing">
            <p>Importez votre fichier CSV intraday pour afficher votre portefeuille.</p>
            <button class="btn-import" id="btn-import-2">Import CSV intraday</button>
        </div>

        <div id="portfolio" class="hidden">
            <div class="haut">
                <div class="bloc bloc-infos" id="infos"></div>
                <div class="bloc bloc-centrale" id="resume"></div>
                <div class="bloc bloc-indices"><table class="indices" id="indices"></table></div>
            </div>
            <h2 id="titre-positions"></h2>
            <div class="table-wrapper">
                <table class="positions">
                    <thead id="positions-head"></thead>
                    <tbody id="positions-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const CLE_CUMUL = "bourse01.cumulVersements";

        const fileInput = document.getElementById("file-input");
        document.getElementById("btn-import").addEventListener("click", () => fileInput.click());
        document.getElementById("btn-import-2").addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => afficher(reader.result);
            reader.readAsText(file, "windows-1252");
        });

        function nettoyerNombre(texte) {
            return String(texte === undefined || texte === null ? "" : texte).trim().replace(/\s/g, "").replace(",", ".");
        }

        function estNombre(texte) {
            const nettoye = nettoyerNombre(texte);
            return /^[+-]?(\d+(\.\d*)?|\.\d+)$/.test(nettoye);
        }

        function parseNombre(texte) {
            if (!estNombre(texte)) return NaN;
            return parseFloat(nettoyerNombre(texte));
        }

        function formatNombre(valeur, decimales) {
            if (isNaN(valeur)) return "";
            return valeur.toLocaleString("fr-FR", {
                minimumFractionDigits: decimales,
                maximumFractionDigits: decimales
            });
        }

        function formatEuro(valeur) {
            if (isNaN(valeur)) return "";
            return formatNombre(valeur, 2) + " €";
        }

        function classeSigne(valeur) {
            return valeur < 0 ? "negatif" : "positif";
        }

        function formatPourcent(valeur) {
            if (isNaN(valeur)) return "—";
            return (valeur >= 0 ? "+" : "") + formatNombre(valeur, 2) + " %";
        }

        function afficher(texte) {
            const lignes = texte.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);

            let indexTable = lignes.findIndex(l => l.startsWith("Valeur;") && l.includes("Code Isin"));
            if (indexTable === -1) {
                alert("Format CSV non reconnu : ligne d'en-tête du tableau introuvable.");
                return;
            }

            const exclusions = ["Votre compte", "Tous les montants", "Plus ou moins", "Total positions SRD"];
            const infosLignes = lignes.slice(0, indexTable)
                .filter(l => !exclusions.some(p => l.startsWith(p)) && !(l.startsWith("Montant;") && l.includes("+/-")));
            const colonnes = lignes[indexTable].split(";").map(c => c.trim()).filter(c => c.length > 0);
            const donnees = lignes.slice(indexTable + 1)
                .map(l => l.split(";"))
                .filter(parts => parts.length >= colonnes.length - 1 && parts[0].length > 0);

            afficherResume(infosLignes);
            afficherInfos(infosLignes);
            afficherIndices();
            afficherTableau(colonnes, donnees);

            document.getElementById("landing").classList.add("hidden");
            document.getElementById("portfolio").classList.remove("hidden");
        }

        function afficherResume(infosLignes) {
            const valeurLigne = (label, index) => {
                const ligne = infosLignes.find(l => l.startsWith(label));
                if (!ligne) return NaN;
                return parseNombre(ligne.split(";")[index]);
            };

            const valeurTotale = valeurLigne("Valeur totale", 1);
            const montantPositions = valeurLigne("Total positions sous dossier", 1);
            const pmvPositions = valeurLigne("Total positions sous dossier", 2);
            const prixRevient = montantPositions - pmvPositions;
            const rendement = !isNaN(prixRevient) && prixRevient !== 0 ? (pmvPositions / prixRevient) * 100 : NaN;

            const resume = document.getElementById("resume");
            resume.innerHTML =
                '<div class="label">Valeur totale</div>' +
                '<div class="valeur-totale">' + formatEuro(valeurTotale) + '</div>' +
                '<div class="label">+/- Valeur positions</div>' +
                '<div class="ligne ' + classeSigne(pmvPositions) + '">' + (isNaN(pmvPositions) ? "—" : (pmvPositions >= 0 ? "+" : "") + formatEuro(pmvPositions)) + '</div>' +
                '<div class="label" style="margin-top:10px">Rendement</div>' +
                '<div class="ligne ' + classeSigne(rendement) + '">' + formatPourcent(rendement) + "</div>";
        }

        const ZONES_INDICES = ["É.-U.", "Europe", "Asie", "Amérique latine", "Devises", "Cryptomonnaies", "Contrats à terme"];

        const INDICES = [
            { zone: "Europe", nom: "DAX", valeur: "26 325,01", variation: "-112,66", pct: -0.43 },
            { zone: "Europe", nom: "FTSE 100", valeur: "10 784,16", variation: "+1,50", pct: 0.01 },
            { zone: "Europe", nom: "CAC 40", valeur: "8 205,37", variation: "+27,48", pct: 0.34 },
            { zone: "Europe", nom: "IBEX 35", valeur: "19 486,00", variation: "+115,10", pct: 0.59 },
            { zone: "Europe", nom: "Euro Stoxx 50", valeur: "6 231,54", variation: "-34,17", pct: -0.55 }
        ];

        function afficherIndices() {
            const table = document.getElementById("indices");
            let html = "<tr>" + ZONES_INDICES.map(z => "<th>" + z + "</th>").join("") + "</tr>";
            INDICES.forEach(ind => {
                const colonne = ZONES_INDICES.indexOf(ind.zone);
                const cellules = ZONES_INDICES.map((z, i) => {
                    if (i !== colonne) return "<td></td>";
                    const classe = ind.pct < 0 ? "negatif" : "positif";
                    const fleche = ind.pct < 0 ? "▼" : "▲";
                    return '<td><span class="nom">' + ind.nom + '</span>' +
                        '<span class="val">' + ind.valeur + '</span> ' +
                        '<span class="' + classe + '">' + fleche + " " + ind.variation + " (" + formatPourcent(ind.pct) + ")</span></td>";
                });
                html += "<tr>" + cellules.join("") + "</tr>";
            });
            table.innerHTML = html;
        }

        function afficherInfos(infosLignes) {
            const conteneur = document.getElementById("infos");
            let html = "<table><tr class=\"entete\"><td>Montant</td><td>+/- Valeur</td></tr>";
            infosLignes.forEach(l => {
                const parts = l.split(";").map(p => p.trim()).filter(p => p.length > 0);
                if (parts.length === 0) return;
                const label = parts[0];
                if (label === "Cumul des versements") {
                    html += '<tr><td>Cumul des versements</td><td><input type="text" id="input-cumul" class="champ-cumul" inputmode="decimal" placeholder=""></td></tr>';
                    return;
                }
                const brut = label === "Total positions sous dossier" ? parts.slice(1, 2) : parts.slice(1);
                const valeurs = brut.map(p => {
                    return estNombre(p) ? formatEuro(parseNombre(p)) : p;
                });
                html += "<tr><td>" + label + "</td><td>" + valeurs.join(" &nbsp;|&nbsp; ") + "</td></tr>";
            });
            html += "</table>";
            conteneur.innerHTML = html;

            const champ = document.getElementById("input-cumul");
            if (champ) {
                champ.value = localStorage.getItem(CLE_CUMUL) || "";
                champ.addEventListener("change", () => {
                    localStorage.setItem(CLE_CUMUL, champ.value.trim());
                });
            }
        }

        function afficherTableau(colonnes, donnees) {
            document.getElementById("titre-positions").textContent = "Positions Actives — " + donnees.length + " valeurs";

            const head = document.getElementById("positions-head");
            head.innerHTML = "<tr>" + colonnes.map(c => "<th>" + c + "</th>").join("") + "</tr>";

            const body = document.getElementById("positions-body");
            body.innerHTML = "";

            const colNumeriques = ["quantité", "cours", "prix moyen", "valorisation", "poids"];

            donnees.forEach(parts => {
                const ligne = document.createElement("tr");
                colonnes.forEach((col, i) => {
                    const brut = (parts[i] || "").trim();
                    const td = document.createElement("td");
                    const cle = col.toLowerCase();

                    if (cle === "valeur") {
                        td.innerHTML = '<span class="symbole">' + brut + "</span>";
                    } else if (colNumeriques.includes(cle)) {
                        const n = parseNombre(brut);
                        td.className = "num";
                        td.textContent = isNaN(n) ? brut : formatNombre(n, 4).replace(/,0+$/, "").replace(/,$/, "");
                    } else if (cle === "performance (%)") {
                        const n = parseNombre(brut);
                        td.className = "num " + (isNaN(n) ? "" : classeSigne(n));
                        td.textContent = isNaN(n) ? brut : (n >= 0 ? "+" : "") + formatNombre(n, 2) + " %";
                    } else if (cle === "+/- value") {
                        const n = parseNombre(brut);
                        td.className = "num " + (isNaN(n) ? "" : classeSigne(n));
                        td.textContent = isNaN(n) ? brut : formatEuro(n);
                    } else {
                        td.textContent = brut;
                    }
                    ligne.appendChild(td);
                });
                body.appendChild(ligne);
            });
        }
    </script>
</body>
</html>
