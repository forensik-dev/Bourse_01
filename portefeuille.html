<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bourse</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0d1b3e;
            color: #fff;
            border-radius: 12px;
            padding: 14px 22px;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5em;
        }

        .btn-import {
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-import:hover {
            background: #1d4ed8;
        }

        .landing {
            background: #fff;
            border-radius: 12px;
            padding: 60px 30px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .landing p {
            color: #666;
            margin-bottom: 24px;
        }

        .resume {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .resume-card {
            flex: 1;
            min-width: 180px;
            background: #fff;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .resume-card .label {
            font-size: 0.8em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .resume-card .valeur {
            font-size: 1.3em;
            font-weight: bold;
        }

        .infos {
            background: #fff;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            font-size: 0.92em;
        }

        .infos table {
            width: 100%;
            border-collapse: collapse;
        }

        .infos td {
            padding: 4px 8px;
        }

        .infos td:first-child {
            color: #666;
            width: 40%;
        }

        h2 {
            font-size: 1.1em;
            margin-bottom: 12px;
        }

        .table-wrapper {
            overflow-x: auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table.positions {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        table.positions th,
        table.positions td {
            padding: 10px 14px;
            text-align: left;
            font-size: 0.88em;
        }

        table.positions th {
            background: #0d1b3e;
            color: #fff;
            text-transform: uppercase;
            font-size: 0.75em;
            letter-spacing: 0.5px;
        }

        table.positions tr:nth-child(even) {
            background: #f8f9fb;
        }

        table.positions tr:hover {
            background: #eef1f6;
        }

        .num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .positif { color: #16a34a; font-weight: 600; }
        .negatif { color: #dc2626; font-weight: 600; }

        .symbole {
            font-weight: bold;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Bourse</h1>
            <button class="btn-import" id="btn-import">Import CSV intraday</button>
            <input type="file" id="file-input" accept=".csv,text/csv" class="hidden">
        </header>

        <div id="landing" class="landing">
            <p>Importez votre fichier CSV intraday pour afficher votre portefeuille.</p>
            <button class="btn-import" id="btn-import-2">Import CSV intraday</button>
        </div>

        <div id="portfolio" class="hidden">
            <div class="resume" id="resume"></div>
            <div class="infos" id="infos"></div>
            <h2 id="titre-positions"></h2>
            <div class="table-wrapper">
                <table class="positions">
                    <thead id="positions-head"></thead>
                    <tbody id="positions-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById("file-input");
        document.getElementById("btn-import").addEventListener("click", () => fileInput.click());
        document.getElementById("btn-import-2").addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => afficher(reader.result);
            reader.readAsText(file, "windows-1252");
        });

        function parseNombre(texte) {
            if (texte === undefined || texte === null) return NaN;
            const nettoye = String(texte).trim().replace(/\s/g, "").replace(",", ".");
            return parseFloat(nettoye);
        }

        function formatNombre(valeur, decimales) {
            if (isNaN(valeur)) return "";
            return valeur.toLocaleString("fr-FR", {
                minimumFractionDigits: decimales,
                maximumFractionDigits: decimales
            });
        }

        function formatEuro(valeur) {
            if (isNaN(valeur)) return "";
            return formatNombre(valeur, 2) + " €";
        }

        function classeSigne(valeur) {
            return valeur < 0 ? "negatif" : "positif";
        }

        function afficher(texte) {
            const lignes = texte.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);

            let indexTable = lignes.findIndex(l => l.startsWith("Valeur;") && l.includes("Code Isin"));
            if (indexTable === -1) {
                alert("Format CSV non reconnu : ligne d'en-tête du tableau introuvable.");
                return;
            }

            const infosLignes = lignes.slice(0, indexTable)
                .filter(l => !l.startsWith("Votre compte"));
            const colonnes = lignes[indexTable].split(";").map(c => c.trim()).filter(c => c.length > 0);
            const donnees = lignes.slice(indexTable + 1)
                .map(l => l.split(";"))
                .filter(parts => parts.length >= colonnes.length - 1 && parts[0].length > 0);

            afficherResume(infosLignes);
            afficherInfos(infosLignes);
            afficherTableau(colonnes, donnees);

            document.getElementById("landing").classList.add("hidden");
            document.getElementById("portfolio").classList.remove("hidden");
        }

        function afficherResume(infosLignes) {
            const valeurLigne = (label, index) => {
                const ligne = infosLignes.find(l => l.startsWith(label));
                if (!ligne) return NaN;
                return parseNombre(ligne.split(";")[index]);
            };

            const valeurTotale = valeurLigne("Valeur totale", 1);
            const montantPositions = valeurLigne("Total positions sous dossier", 1);
            const pmvPositions = valeurLigne("Total positions sous dossier", 2);
            const rendement = !isNaN(montantPositions) && montantPositions !== 0 ? (pmvPositions / montantPositions) * 100 : NaN;

            const cartes = [
                { label: "Valeur totale", texte: formatEuro(valeurTotale), signe: null },
                { label: "+/- Value positions", texte: formatEuro(pmvPositions), signe: pmvPositions },
                { label: "Rendement", texte: isNaN(rendement) ? "" : (rendement >= 0 ? "+" : "") + formatNombre(rendement, 2) + " %", signe: rendement }
            ];

            const resume = document.getElementById("resume");
            resume.innerHTML = "";
            cartes.forEach(c => {
                const carte = document.createElement("div");
                carte.className = "resume-card";
                const classe = c.signe === null ? "" : classeSigne(c.signe);
                carte.innerHTML = '<div class="label">' + c.label + '</div><div class="valeur ' + classe + '">' + c.texte + "</div>";
                resume.appendChild(carte);
            });
        }

        function afficherInfos(infosLignes) {
            const conteneur = document.getElementById("infos");
            let html = "<table>";
            infosLignes.forEach(l => {
                const parts = l.split(";").map(p => p.trim()).filter(p => p.length > 0);
                if (parts.length === 0) return;
                const label = parts[0];
                const valeurs = parts.slice(1).map(p => {
                    const n = parseNombre(p);
                    return isNaN(n) ? p : formatEuro(n);
                });
                html += "<tr><td>" + label + "</td><td>" + valeurs.join(" &nbsp;|&nbsp; ") + "</td></tr>";
            });
            html += "</table>";
            conteneur.innerHTML = html;
        }

        function afficherTableau(colonnes, donnees) {
            document.getElementById("titre-positions").textContent = "Positions Actives — " + donnees.length + " valeurs";

            const head = document.getElementById("positions-head");
            head.innerHTML = "<tr>" + colonnes.map(c => "<th>" + c + "</th>").join("") + "</tr>";

            const body = document.getElementById("positions-body");
            body.innerHTML = "";

            const colNumeriques = ["quantité", "cours", "prix moyen", "valorisation", "poids"];

            donnees.forEach(parts => {
                const ligne = document.createElement("tr");
                colonnes.forEach((col, i) => {
                    const brut = (parts[i] || "").trim();
                    const td = document.createElement("td");
                    const cle = col.toLowerCase();

                    if (cle === "valeur") {
                        td.innerHTML = '<span class="symbole">' + brut + "</span>";
                    } else if (colNumeriques.includes(cle)) {
                        const n = parseNombre(brut);
                        td.className = "num";
                        td.textContent = isNaN(n) ? brut : formatNombre(n, 4).replace(/,0+$/, "").replace(/,$/, "");
                    } else if (cle === "performance (%)") {
                        const n = parseNombre(brut);
                        td.className = "num " + (isNaN(n) ? "" : classeSigne(n));
                        td.textContent = isNaN(n) ? brut : (n >= 0 ? "+" : "") + formatNombre(n, 2) + " %";
                    } else if (cle === "+/- value") {
                        const n = parseNombre(brut);
                        td.className = "num " + (isNaN(n) ? "" : classeSigne(n));
                        td.textContent = isNaN(n) ? brut : formatEuro(n);
                    } else {
                        td.textContent = brut;
                    }
                    ligne.appendChild(td);
                });
                body.appendChild(ligne);
            });
        }
    </script>
</body>
</html>
